name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: ruff format --check . ../../scripts ../../hosted

      - name: Lint
        run: ruff check . ../../scripts ../../hosted

      - name: Type check
        run: mypy .

      - name: Validate agent definitions
        working-directory: .
        run: python scripts/validate_agent_definitions.py

      - name: Test
        run: pytest

      # Broken cross-references were previously only caught by hand, and only
      # under workshop/. This covers docs/, the ADRs and the root README too.
      - name: Check markdown links
        working-directory: .
        run: python scripts/check_workshop_links.py

      # A removal that lands in code but not in the prose is still valid
      # markdown, so nothing else catches it.
      - name: Check for stale references
        working-directory: .
        run: python scripts/check_stale_references.py

      # Screenshots can carry tenant names, subscription ids and UPNs. The
      # OCR pass needs Tesseract plus its Python bindings, so it is a separate
      # step rather than part of the Python job's dependency set.
      # CI has no deployment, so it has no portal_redact.config.json and runs
      # the email and GUID scans only. Run it locally with the real config
      # before publishing new screenshots.
      - name: Check screenshots for identifiers
        working-directory: .
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
          python -m pip install pillow pytesseract
          python scripts/check_screenshot_redaction.py --allow-example-config

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the App Service runtime (NODE:22-lts). Building on 20 while
          # production runs 22 means CI cannot catch a runtime break.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  infra:
    name: Infrastructure (Terraform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check formatting
        run: terraform fmt -check -recursive

      # No backend/credentials needed: validate only checks configuration.
      - name: Initialize without a backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  agent-definitions:
    name: Agent definitions (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r services/api/requirements-dev.txt

      # Offline GenAIOps gate. Agents are ephemeral, so there is nothing to
      # deploy; this validates the definitions the runtime loads.
      - name: Validate agent definitions
        run: python scripts/validate_agent_definitions.py

      # Scores the synthetic cases against evals/expected_checks.yaml using
      # in-repo fixtures. Structural and safety only, no Azure, no cost.
      - name: Run evals (offline)
        run: python ../../scripts/run_evals.py --offline
        working-directory: services/api

