# Where the .NET track may differ from the recorded Python behaviour, and how
# the .NET conformance tests compare in each case. Anything not listed here
# must match conformance/goldens exactly.
#
# Keep this list short. Each entry is a place the two tracks are allowed to
# disagree, so each one needs a reason a learner would accept.

placeholders:
  - token: "<uuid>"
    meaning: A UUID generated by this run (correlation id, plan id, audit event id).
    accepts: Any lowercase RFC 4122 UUID.
  - token: "<now>"
    meaning: A UTC timestamp written by this run.
    accepts: Any timestamp formatted YYYY-MM-DDTHH:MM:SSZ.
  - token: "<ms>"
    meaning: A measured duration (latency_ms, and duration_ms on runtime plan-generation audit rows).
    accepts: Any non-negative integer.

differences:
  - id: track-paths
    where: Setup guidance and error messages that name a script, a folder or the env file.
    python: Names python/ paths and .py scripts.
    dotnet: Names the same steps under dotnet/.
    compared_by: Golden strings are rewritten with track_substitutions below, then compared exactly.

  - id: cors-preflight
    where: OPTIONS requests that carry Access-Control-Request-Method.
    python: Starlette's CORS middleware answers 200 "OK" when it accepts a preflight and 400 when it rejects one, listing the configured methods and headers either way.
    dotnet: ASP.NET Core's CORS middleware answers 204, with CORS headers only when it accepts.
    compared_by: The browser's verdict. A preflight passes when the status is 2xx, Access-Control-Allow-Origin equals the request origin, and the requested method and every requested non-safelisted header are allowed. Both tracks must reach the same verdict for every recorded preflight. Simple (non-preflight) requests are compared exactly.

  - id: api-explorer
    where: /api/openapi.json and /api/docs (local development only; both are off on App Service in both tracks).
    python: FastAPI's generated OpenAPI document and Swagger UI.
    dotnet: ASP.NET Core's generated OpenAPI document and Swagger UI.
    compared_by: Not compared. Both list the same endpoints; the generated documents differ in framework detail.

# Applied to every golden string before it is compared with this track's
# output, longest first. Each pair names the same file or step in each track.
track_substitutions:
  - python: 'python python/scripts/validate_agent_definitions.py'
    dotnet: 'dotnet run dotnet/scripts/validate_agent_definitions.cs'
  - python: 'python/scripts/validate_agent_definitions.py'
    dotnet: 'dotnet/scripts/validate_agent_definitions.cs'
  - python: '.\python\scripts\populate-env.ps1'
    dotnet: '.\dotnet\scripts\populate-env.ps1'
  - python: '.\python\scripts\run-backend.ps1'
    dotnet: '.\dotnet\scripts\run-backend.ps1'
  - python: 'python/services/api/.env'
    dotnet: 'dotnet/services/api/.env'
  - python: '/python/infra'
    dotnet: '/dotnet/infra'
