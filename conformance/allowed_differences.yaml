# Where the .NET track may differ from the recorded Python behaviour, and how
# the .NET conformance tests compare in each case. Anything not listed here
# must match conformance/goldens exactly.
#
# Keep this list short. Each entry is a place the two tracks are allowed to
# disagree, so each one needs a reason a learner would accept.

placeholders:
  - token: "<uuid>"
    meaning: A UUID generated by this run (correlation id, plan id, audit event id).
    accepts: Any lowercase RFC 4122 UUID.
  - token: "<now>"
    meaning: A UTC timestamp written by this run.
    accepts: Any timestamp formatted YYYY-MM-DDTHH:MM:SSZ.
  - token: "<ms>"
    meaning: A measured duration (latency_ms, and duration_ms on runtime plan-generation audit rows).
    accepts: Any non-negative integer.

differences:
  - id: track-paths
    where: Setup guidance and error messages that name a script, a folder or the env file.
    python: Names python/ paths and .py scripts.
    dotnet: Names the same steps under dotnet/.
    compared_by: Golden strings are rewritten with track_substitutions below, then compared exactly.

  - id: cors-preflight
    where: OPTIONS requests that carry Access-Control-Request-Method.
    python: Starlette's CORS middleware answers 200 "OK" when it accepts a preflight and 400 when it rejects one, listing the configured methods and headers either way.
    dotnet: ASP.NET Core's CORS middleware answers 204, with CORS headers only when it accepts.
    compared_by: The browser's verdict. A preflight passes when the status is 2xx, Access-Control-Allow-Origin equals the request origin, and the requested method and every requested non-safelisted header are allowed. Both tracks must reach the same verdict for every recorded preflight. Simple (non-preflight) requests are compared exactly.

  - id: api-explorer
    where: /api/openapi.json and /api/docs (local development only; both are off on App Service in both tracks).
    python: FastAPI's generated OpenAPI document and Swagger UI.
    dotnet: ASP.NET Core's generated OpenAPI document and Swagger UI.
    compared_by: Not compared. Both list the same endpoints; the generated documents differ in framework detail.

  - id: mutated-workflow-message
    where: Workshop sample 7's lesson, and the test that reproduces it (a workflow whose message is changed in place after it is sent).
    python: Agent Framework for Python lets a later change to the sent object make a second conditional edge fire, so one run yields two answers.
    dotnet: In Agent Framework for .NET the same flow yields one answer; changing the object after it was sent does not make a second edge fire.
    compared_by: Each track's test asserts its own framework's behaviour. Both samples use immutable messages and teach the rule; only the .NET wording of the failure it prevents differs.

  - id: agent-reply-handoff
    where: Workshop sample 6, an agent's reply handed to the next agent in a workflow.
    python: The next agent receives the previous agent's reply as an assistant message.
    dotnet: Agent Framework for .NET relabels it as a user message by default, which the Foundry Responses API rejects (output_text content in a user message), so sample 6 turns the relabelling off.
    compared_by: Sample 6 runs in both tracks and yields one answer.

  - id: failed-step-span-status
    where: The spans of a plan run in which a node fails (no evidence, a provider error, an off-contract reply), and Module 10's failure query.
    python: Agent Framework for Python marks the failed executor.process span and the invoke_workflow span as errors, with error.type, so Application Insights shows them with success == false.
    dotnet: Agent Framework for .NET reports the failure as an executor-failed event and leaves those spans' status unset. A failed model call still marks its chat and invoke_agent spans as errors.
    compared_by: Each track's observability test asserts that the failing node's span is captured and carries no model output. The API response and the audit row are identical in both tracks.

  - id: runaway-loop-guard
    where: Workshop sample 7 and Module 3's repair bound (a workflow cycle whose condition never turns false).
    python: Agent Framework for Python stops a workflow after a fixed number of supersteps, so a runaway cycle ends with an error.
    dotnet: Agent Framework for .NET has no superstep limit; a runaway cycle runs until it is cancelled.
    compared_by: Not compared. Both apps bound the repair loop by the attempt count carried in the message, so neither depends on the framework's guard.

  - id: telemetry-span-shapes
    where: The OpenTelemetry spans each track exports to Application Insights (Module 10).
    python: Agent calls are INTERNAL spans named `invoke_agent <agent>`, and a failed model call records error.type as the exception's class name.
    dotnet: Agent calls are CLIENT spans named `invoke_agent <agent>(<id>)` (the app sets the id to the role), each run has a `workflow.session` span above `invoke_workflow`, and a failed model call records the exception's full type name with its message as the span's status description. Sensitive-data capture is off by default in both; in .NET the OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT environment variable also turns it on.
    compared_by: Not compared span by span. Each track's observability test asserts that every node emits an executor span, that the workflow span exists, and that no user text or model output reaches any span.

  - id: provider-retries
    where: A model call that fails with a retryable status.
    python: The OpenAI client retries twice, with jittered exponential waits, on 408, 409, 429 and 5xx.
    dotnet: System.ClientModel retries twice (the app sets the count to match Python), waiting 0.8 and then 1.6 seconds or as Retry-After asks, on 408, 429, 500, 502, 503 and 504.
    compared_by: Not compared. Both tracks map an exhausted retry to the same typed status.

# Applied to every golden string before it is compared with this track's
# output, longest first. Each pair names the same file or step in each track.
track_substitutions:
  - python: 'python python/scripts/validate_agent_definitions.py'
    dotnet: 'dotnet run dotnet/scripts/validate_agent_definitions.cs'
  - python: 'python/scripts/validate_agent_definitions.py'
    dotnet: 'dotnet/scripts/validate_agent_definitions.cs'
  - python: '.\python\scripts\populate-env.ps1'
    dotnet: '.\dotnet\scripts\populate-env.ps1'
  - python: '.\python\scripts\run-backend.ps1'
    dotnet: '.\dotnet\scripts\run-backend.ps1'
  - python: 'python/services/api/.env'
    dotnet: 'dotnet/services/api/.env'
  - python: '/python/infra'
    dotnet: '/dotnet/infra'
