id: data-analyst-agent
name: Data Analyst Agent
version: 1.0.0

# Runtime binding: which Azure AI Foundry model deployment this agent
# invokes. `deployment_env` names the environment variable that provides
# the deployment name at runtime. Nothing here is a secret.
runtime:
  provider: azure_foundry
  deployment_env: AZURE_AI_FOUNDRY_DEPLOYMENT
  api_version_env: AZURE_AI_FOUNDRY_API_VERSION
  response_format: json_object
  max_output_tokens: 800
  timeout_seconds: 30

# References into the versioned contract library. Adapters look these
# up in /contracts/v1 rather than following relative paths.
contracts:
  input:
    schema_ref: data-analysis-request.schema.json
    schema_version: 1.0.0
  output:
    schema_ref: data-analysis-result.schema.json
    schema_version: 1.0.0

# Downstream consumers of this agent's output.
handoff:
  - agent: support-recommendation-agent
    contract: data-analysis-result.schema.json
    version: 1.0.0
  - agent: validator-agent
    contract: data-analysis-result.schema.json
    version: 1.0.0

safety:
  human_review_required: true
  determinations_forbidden:
    - educational
    - clinical
    - legal
    - disability
    - compliance
    - placement
  untrusted_data_delimiter: "<<<UNTRUSTED_DATA>>>"

tags:
  - synthetic-data-only
  - metadata-only-telemetry
