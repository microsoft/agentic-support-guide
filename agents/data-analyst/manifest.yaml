id: data-analyst-agent
name: Data Analyst Agent
version: 1.0.0

# Remote Foundry Agent Service binding. The remote agent is created and
# updated by each track's publish_prompt_agents tool from agent.md + this manifest.
foundry:
  model_deployment_env: FOUNDRY_MODEL_DEPLOYMENT_ANALYST
  response_format: json_object
  temperature: 0.2
  max_output_tokens: 800

runtime:
  provider: azure_foundry_responses

contracts:
  input:
    schema_ref: schemas/input.schema.json
    schema_version: 1.0.0
  output:
    schema_ref: schemas/output.schema.json
    schema_version: 1.0.0

handoff:
  - agent: support-recommendation-agent
  - agent: validator-agent

safety:
  human_review_required: true
  determinations_forbidden:
    - pricing
    - financing
    - credit
    - legal
    - compliance
    - safety
    - staffing
  untrusted_data_delimiter: "<<<UNTRUSTED_DATA>>>"

tags:
  - synthetic-data-only
  - metadata-only-telemetry
