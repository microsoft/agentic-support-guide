id: support-recommendation-agent
name: Support Recommendation Agent
version: 1.0.0

foundry:
  model_deployment_env: FOUNDRY_MODEL_DEPLOYMENT_RECOMMENDER
  response_format: json_object
  temperature: 0.2
  max_output_tokens: 800

runtime:
  provider: azure_foundry_responses

contracts:
  input:
    schema_ref: support-recommendation-request.schema.json
    schema_version: 1.0.0
  output:
    schema_ref: support-recommendation-result.schema.json
    schema_version: 1.0.0

handoff:
  - agent: validator-agent
    contract: support-recommendation-result.schema.json
    version: 1.0.0

safety:
  human_review_required: true
  determinations_forbidden:
    - pricing
    - financing
    - credit
    - legal
    - compliance
    - safety
    - staffing
  untrusted_data_delimiter: "<<<UNTRUSTED_DATA>>>"
  catalog_only: true

tags:
  - synthetic-data-only
  - metadata-only-telemetry
