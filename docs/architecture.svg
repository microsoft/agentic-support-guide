<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1020" width="1700" height="1020" role="img" aria-labelledby="asg-title asg-desc">
  <title id="asg-title">Agentic Support Guide - C4 Container view</title>
  <desc id="asg-desc">A person "Demo User" interacts with the Agentic Support Guide software system. Inside that system, a Web App container calls an API Service container over HTTP. The API Service reads Synthetic Data, validates messages against Protocol Contracts, and loads sync metadata from Agent Definitions. The API Service invokes three remote agents hosted in Azure AI Foundry via keyless Entra ID; those agents use a Model Deployment. The API Service also emits metadata-only telemetry to Observability. A Terraform and Scripts container in an Operations software system provisions Azure AI Foundry and syncs Agent Definitions.</desc>
  <rect x="0" y="0" width="1700" height="1020" fill="#ffffff" />
  <style type="text/css">
    .title { font: bold 22px 'Segoe UI', Arial, sans-serif; fill: #2c3e50; text-anchor: middle; }
    .boundary { fill: none; stroke: #7f8c8d; stroke-width: 2; stroke-dasharray: 8 5; }
    .boundary-label { font: bold 15px 'Segoe UI', Arial, sans-serif; fill: #34495e; }
    .container-label { font: bold 14px 'Segoe UI', Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    .container-desc { font: 12px 'Segoe UI', Arial, sans-serif; fill: #ecf0f1; text-anchor: middle; }
    .container-stroke { stroke: #2c3e50; stroke-width: 1; }
    .arrow { fill: none; stroke: #34495e; stroke-width: 1.6; }
    .arrow-label { font: 11px 'Segoe UI', Arial, sans-serif; fill: #2c3e50; text-anchor: middle; }
    .arrow-label-bg { fill: #ffffff; stroke: none; }
    .person-fill { fill: #7f8c8d; stroke: #2c3e50; stroke-width: 1; }
    .person-label { font: bold 13px 'Segoe UI', Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    .type-note { font: italic 11px 'Segoe UI', Arial, sans-serif; fill: #2c3e50; text-anchor: middle; }
    .LocalApp { fill: #5b8def; }
    .AgentAssets { fill: #9b8ac4; }
    .Azure { fill: #3178c6; }
    .Ops { fill: #6c8ea4; }
    .Data { fill: #8aa27a; }
  </style>
  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495e" />
    </marker>
  </defs>

  <text x="850" y="42" class="title">Agentic Support Guide - C4 Container view</text>

  <!-- Demo User -->
  <circle cx="90" cy="145" r="22" class="person-fill" />
  <rect x="50" y="170" width="80" height="60" rx="6" class="person-fill container-stroke" />
  <text x="90" y="205" class="person-label">Demo User</text>
  <text x="90" y="253" class="type-note">[Person]</text>

  <!-- Boundary: Agentic Support Guide -->
  <rect x="200" y="90" width="700" height="900" rx="14" class="boundary" />
  <text x="215" y="980" class="boundary-label">Software System: Agentic Support Guide</text>

  <!-- Web App -->
  <rect x="220" y="140" width="280" height="120" rx="10" class="LocalApp container-stroke" />
  <text x="360" y="178" class="container-label">Web App</text>
  <text x="360" y="200" class="container-desc">[Container: React + TypeScript]</text>
  <text x="360" y="224" class="container-desc">React and TypeScript</text>
  <text x="360" y="242" class="container-desc">user interface</text>

  <!-- API Service -->
  <rect x="580" y="140" width="300" height="120" rx="10" class="LocalApp container-stroke" />
  <text x="730" y="178" class="container-label">API Service</text>
  <text x="730" y="200" class="container-desc">[Container: FastAPI]</text>
  <text x="730" y="224" class="container-desc">Hosts deterministic orchestration</text>
  <text x="730" y="242" class="container-desc">logic that calls remote agents</text>

  <!-- Synthetic Data -->
  <rect x="220" y="310" width="205" height="140" rx="10" class="Data container-stroke" />
  <text x="322" y="352" class="container-label">Synthetic Data</text>
  <text x="322" y="374" class="container-desc">[In-memory]</text>
  <text x="322" y="400" class="container-desc">In-memory synthetic</text>
  <text x="322" y="418" class="container-desc">learner signals</text>

  <!-- Protocol Contracts -->
  <rect x="445" y="310" width="210" height="140" rx="10" class="AgentAssets container-stroke" />
  <text x="550" y="352" class="container-label">Protocol Contracts</text>
  <text x="550" y="374" class="container-desc">[JSON Schema]</text>
  <text x="550" y="400" class="container-desc">Versioned JSON Schema</text>
  <text x="550" y="418" class="container-desc">message contracts</text>

  <!-- Agent Definitions -->
  <rect x="675" y="310" width="205" height="140" rx="10" class="AgentAssets container-stroke" />
  <text x="777" y="352" class="container-label">Agent Definitions</text>
  <text x="777" y="374" class="container-desc">[Config files]</text>
  <text x="777" y="400" class="container-desc">Source-controlled agent.md</text>
  <text x="777" y="418" class="container-desc">and manifest.yaml files</text>

  <!-- Boundary: Azure AI Foundry -->
  <rect x="1000" y="90" width="600" height="600" rx="14" class="boundary" />
  <text x="1015" y="680" class="boundary-label">Software System: Azure AI Foundry</text>

  <!-- Foundry Project -->
  <rect x="1020" y="140" width="260" height="140" rx="10" class="Azure container-stroke" />
  <text x="1150" y="180" class="container-label">Foundry Project</text>
  <text x="1150" y="203" class="container-desc">[Container: Azure AI Foundry]</text>
  <text x="1150" y="228" class="container-desc">Azure AI Foundry project</text>
  <text x="1150" y="246" class="container-desc">boundary</text>

  <!-- Remote Foundry Agents (taller for 3-line description) -->
  <rect x="1320" y="140" width="260" height="180" rx="10" class="Azure container-stroke" />
  <text x="1450" y="180" class="container-label">Remote Foundry Agents</text>
  <text x="1450" y="203" class="container-desc">[Container: Agent Service]</text>
  <text x="1450" y="228" class="container-desc">Data Analyst Agent,</text>
  <text x="1450" y="248" class="container-desc">Support Recommendation Agent,</text>
  <text x="1450" y="268" class="container-desc">Validator Agent</text>

  <!-- Model Deployment -->
  <rect x="1020" y="380" width="260" height="140" rx="10" class="Azure container-stroke" />
  <text x="1150" y="420" class="container-label">Model Deployment</text>
  <text x="1150" y="443" class="container-desc">[Serverless model]</text>
  <text x="1150" y="468" class="container-desc">Azure-hosted model</text>
  <text x="1150" y="486" class="container-desc">used by remote agents</text>

  <!-- Observability -->
  <rect x="1320" y="380" width="260" height="140" rx="10" class="Azure container-stroke" />
  <text x="1450" y="420" class="container-label">Observability</text>
  <text x="1450" y="443" class="container-desc">[Azure Monitor]</text>
  <text x="1450" y="468" class="container-desc">Metadata-only telemetry</text>
  <text x="1450" y="486" class="container-desc">and audit events</text>

  <!-- Boundary: Operations -->
  <rect x="1000" y="720" width="600" height="200" rx="14" class="boundary" />
  <text x="1015" y="910" class="boundary-label">Software System: Operations</text>

  <!-- Terraform and Scripts -->
  <rect x="1060" y="770" width="500" height="120" rx="10" class="Ops container-stroke" />
  <text x="1310" y="812" class="container-label">Terraform and Scripts</text>
  <text x="1310" y="835" class="container-desc">[Container: CLI tooling]</text>
  <text x="1310" y="860" class="container-desc">Provision resources, sync agents,</text>
  <text x="1310" y="878" class="container-desc">and verify demo readiness</text>

  <!-- =========== Relationships =========== -->

  <!-- 1. Demo User -> Web App -->
  <line x1="135" y1="200" x2="216" y2="200" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="152" y="184" width="42" height="14" class="arrow-label-bg" />
  <text x="173" y="195" class="arrow-label">uses</text>

  <!-- 2. Web App -> API Service -->
  <line x1="500" y1="200" x2="576" y2="200" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="504" y="184" width="72" height="14" class="arrow-label-bg" />
  <text x="540" y="195" class="arrow-label">HTTP /api</text>

  <!-- 3. API Service -> Synthetic Data -->
  <line x1="640" y1="260" x2="360" y2="308" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="416" y="277" width="130" height="14" class="arrow-label-bg" />
  <text x="481" y="288" class="arrow-label">reads synthetic data</text>

  <!-- 4. API Service -> Protocol Contracts -->
  <line x1="730" y1="260" x2="550" y2="308" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="580" y="277" width="120" height="14" class="arrow-label-bg" />
  <text x="640" y="288" class="arrow-label">validates messages</text>

  <!-- 5. API Service -> Agent Definitions -->
  <line x1="820" y1="260" x2="777" y2="308" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="735" y="277" width="130" height="14" class="arrow-label-bg" />
  <text x="800" y="288" class="arrow-label">loads sync metadata</text>

  <!-- 6. API Service -> Foundry Project (keyless Entra ID) -->
  <line x1="880" y1="220" x2="1016" y2="220" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="900" y="207" width="94" height="14" class="arrow-label-bg" />
  <text x="947" y="218" class="arrow-label">keyless Entra ID</text>

  <!-- 7. API Service -> Remote Foundry Agents (invokes via SDK), routed above containers -->
  <path d="M 880 180 L 940 180 L 940 118 L 1450 118 L 1450 136" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="1075" y="105" width="200" height="14" class="arrow-label-bg" />
  <text x="1175" y="116" class="arrow-label">invokes via Foundry Agents SDK</text>

  <!-- 8. API Service -> Observability (emits metadata only), routed below containers -->
  <path d="M 880 245 L 970 245 L 970 555 L 1450 555 L 1450 522" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="1210" y="547" width="130" height="14" class="arrow-label-bg" />
  <text x="1275" y="558" class="arrow-label">emits metadata only</text>

  <!-- 9. Remote Foundry Agents -> Model Deployment (uses model), routed in gap between rows -->
  <path d="M 1450 320 L 1450 350 L 1150 350 L 1150 376" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="1265" y="341" width="70" height="14" class="arrow-label-bg" />
  <text x="1300" y="352" class="arrow-label">uses model</text>

  <!-- 10. Remote Foundry Agents -> Foundry Project (hosted in project), routed below Foundry Project so it does not conflict with the "invokes SDK" channel above the containers -->
  <path d="M 1320 220 L 1300 220 L 1300 300 L 1150 300 L 1150 284" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="1170" y="293" width="110" height="14" class="arrow-label-bg" />
  <text x="1225" y="304" class="arrow-label">hosted in project</text>

  <!-- 11. Terraform and Scripts -> Azure AI Foundry (provisions and verifies) -->
  <line x1="1300" y1="770" x2="1300" y2="694" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="1310" y="697" width="152" height="14" class="arrow-label-bg" />
  <text x="1386" y="708" class="arrow-label">provisions and verifies</text>

  <!-- 12. Terraform and Scripts -> Agent Definitions (syncs definitions), routed via boundary strip -->
  <path d="M 1060 830 L 950 830 L 950 470 L 777 470 L 777 452" class="arrow" marker-end="url(#arrow-head)" />
  <rect x="800" y="462" width="108" height="14" class="arrow-label-bg" />
  <text x="854" y="473" class="arrow-label">syncs definitions</text>
</svg>
